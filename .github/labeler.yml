documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file: 'pyproject.toml'

feature:
  - changed-files:
      - any-glob-to-any-file: '**/*.py'

internal:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'releases/**'

# we don't want Release PR in the changelog
ignore-for-release:
  - changed-files:
      - any-glob-to-any-file: 'volue_insight_timeseries/VERSION'
