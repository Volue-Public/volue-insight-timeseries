name: Publish package

on:
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed

jobs:
  publish-package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - run: pip install -U setuptools twine wheel

      - name: Read version
        id: read-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout main
          # The newest release (final or rc) is the one "Create Release" just
          # made. Resolve it by release rather than `git describe`, which is
          # ambiguous when an rc tag and the final tag sit on the same commit.
          tag_name=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName')
          tag_sha=$(git rev-parse "${tag_name}^{commit}")
          if [[ "${tag_sha}" != "$(git rev-parse HEAD)" ]]; then
            echo "Newest release ${tag_name} is at ${tag_sha}, not at the checked-out main HEAD" >&2
            exit 1
          fi
          version=${tag_name#v}
          echo "$version" > volue_insight_timeseries/VERSION
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build dist
        id: build-dist
        run: |
          rm -rf dist
          python setup.py sdist bdist_wheel

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
