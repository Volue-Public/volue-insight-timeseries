name: Publish package

on:
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed

jobs:
  publish-package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - run: pip install -U setuptools twine wheel

      - name: Read version
        id: read-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The checked-out commit is the one "Create Release" tagged. Pick the
          # newest release pointing at it; when an rc and the final release
          # share a commit, the newest is the one that run created. Drafts are
          # excluded because their tag does not exist yet.
          head_sha=$(git rev-parse HEAD)
          # Captured first so a gh failure aborts here instead of being
          # swallowed by a process substitution.
          candidates=$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --json tagName --jq '.[].tagName')
          tag_name=""
          while read -r candidate; do
            [[ -n "${candidate}" ]] || continue
            candidate_sha=$(git rev-parse --verify --quiet "${candidate}^{commit}" || true)
            if [[ "${candidate_sha}" == "${head_sha}" ]]; then
              tag_name="${candidate}"
              break
            fi
          done <<< "${candidates}"
          if [[ -z "${tag_name}" ]]; then
            echo "No release points at the checked-out commit ${head_sha}" >&2
            exit 1
          fi
          echo "${tag_name}" > volue_insight_timeseries/VERSION
          echo "VERSION=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Build dist
        id: build-dist
        run: |
          rm -rf dist
          python setup.py sdist bdist_wheel

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
