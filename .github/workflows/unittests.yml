name: unittests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unittests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
        libraries-versions: [ 'pandas==1.5.2 "numpy<2.0"', 'pandas==2.2.2', 'pandas>=2.2.3', 'pandas>=2.3.3' ]
        exclude:
          - python-version: '3.12'
            libraries-versions: 'pandas==1.5.2 "numpy<2.0"'
          - python-version: '3.13'
            libraries-versions: 'pandas==1.5.2 "numpy<2.0"'
          - python-version: '3.13'
            libraries-versions: 'pandas==2.2.2'
          - python-version: '3.14'
            libraries-versions: 'pandas==1.5.2 "numpy<2.0"'
          - python-version: '3.14'
            libraries-versions: 'pandas==2.2.2'
          - python-version: '3.14'
            libraries-versions: 'pandas>=2.2.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-${{ hashFiles('**/requirements.txt', '**/test-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies ${{ matrix.python-version }}
        run: |
          REQS="-r requirements.txt -r test-requirements.txt"
          pip install --upgrade --upgrade-strategy eager ${REQS}
          pip install ${{ matrix.libraries-versions }}

      - name: Run tests
        run: |
          python -m pytest -vv

  no-pandas:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.14' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies without pandas ${{ matrix.python-version }}
        run: |
          pip install -r requirements.txt -r test-requirements.txt

      # The core install must not pull pandas or numpy.
      # If a new dependency pulls pandas, this step fails.
      - name: Fail if pandas or numpy is installed
        run: |
          python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('pandas', 'numpy')))"

      # test_util.py imports pandas at module level, so skip it here.
      - name: Run tests without pandas
        run: |
          python -m pytest -vv --ignore=unittest/test_util.py

