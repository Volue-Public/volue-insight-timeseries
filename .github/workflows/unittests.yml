name: unittests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unittests:
    timeout-minutes: 15
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        # Per Python version: the oldest pandas with prebuilt wheels for it,
        # and the latest pandas pip resolves (already installed by the eager upgrade).
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; pin 3.9 to 24.04.
          - python-version: '3.9'
            libraries-versions: 'pandas==1.5.0 "numpy<2.0"'
            os: ubuntu-24.04
          - python-version: '3.9'
            libraries-versions: 'pandas'
            os: ubuntu-24.04
          - python-version: '3.10'
            libraries-versions: 'pandas==1.5.0 "numpy<2.0"'
          - python-version: '3.10'
            libraries-versions: 'pandas'
          - python-version: '3.11'
            libraries-versions: 'pandas==1.5.0 "numpy<2.0"'
          - python-version: '3.11'
            libraries-versions: 'pandas'
          - python-version: '3.12'
            libraries-versions: 'pandas==2.1.1 "numpy<2.0"'
          - python-version: '3.12'
            libraries-versions: 'pandas'
          - python-version: '3.13'
            libraries-versions: 'pandas==2.2.3'
          - python-version: '3.13'
            libraries-versions: 'pandas'
          - python-version: '3.14'
            libraries-versions: 'pandas==2.3.3'
          - python-version: '3.14'
            libraries-versions: 'pandas'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-${{ hashFiles('**/requirements.txt', '**/test-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies ${{ matrix.python-version }}
        run: |
          REQS="-r requirements.txt -r test-requirements.txt"
          pip install --upgrade --upgrade-strategy eager ${REQS}
          pip install ${{ matrix.libraries-versions }}

      - name: Run tests
        run: |
          python -m pytest -vv

