name: unittests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unittests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
        libraries-versions: [ 'pandas==1.5.2 "numpy<2.0"', 'pandas==2.2.2', 'pandas>=2.2.3', 'pandas>=2.3.3' ]
        exclude:
          - python-version: '3.12'
            libraries-versions: 'pandas==1.5.2 "numpy<2.0"'
          - python-version: '3.13'
            libraries-versions: 'pandas==1.5.2 "numpy<2.0"'
          - python-version: '3.13'
            libraries-versions: 'pandas==2.2.2'
          - python-version: '3.14'
            libraries-versions: 'pandas==1.5.2 "numpy<2.0"'
          - python-version: '3.14'
            libraries-versions: 'pandas==2.2.2'
          - python-version: '3.14'
            libraries-versions: 'pandas>=2.2.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.libraries-versions }}-
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies ${{ matrix.python-version }}
        run: |
          pip install --upgrade --upgrade-strategy eager -e ".[test]"
          pip install ${{ matrix.libraries-versions }}

      - name: Run tests
        run: |
          python -m pytest -vv

